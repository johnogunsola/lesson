<title> News &mdash; Media </title>
<meta charset="UTF-8">
<style>
canvas { border: 1px solid #000000; }

@keyframes hue {
  0% {
    filter: hue-rotate(0deg) blur(5px);
    transform: scale(0.5);
  }
  50% {
    filter: hue-rotate(360deg) blur(0px);
    transform: scale(0.6);
  }
  100% {
    filter: hue-rotate(0deg) blur(5px);
    transform: scale(0.5);
  }
}

@keyframes bgColorChange {
  0%   { background-color: #ff6b6b; } /* Red-ish */
  50%  { background-color: #4ecdc4; } /* Teal */
  100% { background-color: #ffe66d; }
}

/* optional: apply background animation to body */
body { animation: bgColorChange 10s linear infinite; }
</style>
